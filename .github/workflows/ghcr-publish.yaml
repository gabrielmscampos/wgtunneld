name: Publish Container Images

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wgtunneld-server:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/wgtunneld-server:latest

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wgtunneld-client:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/wgtunneld-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

